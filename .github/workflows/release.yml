name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: odoo-erp-mcp-linux
            target: x86_64-unknown-linux-gnu
            binary: odoo-erp-mcp
            suffix: linux
          - os: windows-latest
            artifact_name: odoo-erp-mcp-windows
            target: x86_64-pc-windows-msvc
            binary: odoo-erp-mcp.exe
            suffix: windows
          - os: macos-latest
            artifact_name: odoo-erp-mcp-macos
            target: aarch64-apple-darwin
            binary: odoo-erp-mcp
            suffix: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ASSET="odoo-erp-mcp-${{ matrix.suffix }}-${VERSION}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${ASSET}"
          echo "ASSET_PATH=${ASSET}" >> $GITHUB_ENV

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ASSET="odoo-erp-mcp-${{ matrix.suffix }}-${VERSION}.exe"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${ASSET}"
          echo "ASSET_PATH=${ASSET}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.ASSET_PATH }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: odoo-erp-mcp ${{ github.ref_name }}
          files: |
            odoo-erp-mcp-linux/*
            odoo-erp-mcp-windows/*
            odoo-erp-mcp-macos/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
