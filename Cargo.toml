[package]
name = "odoo-erp-mcp"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
chrono = "0.4.44"
dotenvy = "0.15.7"
futures = "0.3.32"
mcp-core = "0.1.50"
mime_guess = "2.0.5"
reqwest = { version = "0.13.2", features = ["json", "cookies"] }
rust-mcp-sdk = "0.9.0"
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full", "macros"] }
tower-http = { version = "0.6.8", features = ["fs"] }
uuid = { version = "1.23.0", features = ["v4"] }
