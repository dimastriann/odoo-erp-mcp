apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odoo-erp-mcp
  namespace: odoo-erp-mcp
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mcp.example.com
      secretName: odoo-erp-mcp-tls
  rules:
    - host: mcp.example.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: odoo-erp-mcp
                port:
                  name: mcp
