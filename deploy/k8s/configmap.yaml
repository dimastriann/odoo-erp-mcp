apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-erp-mcp-config
  namespace: odoo-erp-mcp
data:
  config.json: |
    {
      "global_settings": {
        "remote_mcp": {
          "enabled": true,
          "bind_address": "0.0.0.0:3334",
          "api_key_envs": ["ODOO_MCP_REMOTE_API_KEY"],
          "jwt_hs256_secret_env": null,
          "oauth": null,
          "rbac": null
        }
      },
      "tenants": [],
      "instances": [],
      "folders": [],
      "prompts": []
    }
