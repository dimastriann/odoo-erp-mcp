apiVersion: v1
kind: Service
metadata:
  name: odoo-erp-mcp
  namespace: odoo-erp-mcp
  labels:
    app.kubernetes.io/name: odoo-erp-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: odoo-erp-mcp
  ports:
    - name: ui
      port: 3333
      targetPort: ui
    - name: mcp
      port: 3334
      targetPort: mcp
