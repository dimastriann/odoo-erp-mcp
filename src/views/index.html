<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odoo MCP Admin</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31/dist/vue.global.prod.js" defer></script>
    <script src="/pagination.js" defer></script>
    <script src="/app.js" defer></script>
</head>
<body class="min-h-screen">
<div id="app" v-cloak>
    <section v-if="!authenticated" class="login-shell">
        <form @submit.prevent="login" class="panel login-card">
            <div class="brand-mark">O</div>
            <h1 class="text-2xl font-bold mt-5">Odoo MCP Admin</h1>
            <p class="muted text-sm mt-2 mb-6">Sign in to manage your connections and prompts.</p>
            <div class="space-y-4">
                <label class="field"><span>Username</span><input v-model="loginForm.username" autocomplete="username" required></label>
                <label class="field"><span>Password</span><input v-model="loginForm.password" type="password" autocomplete="current-password" required></label>
                <p v-if="loginError" class="text-red-400 text-sm">{{ loginError }}</p>
                <button class="button primary w-full" type="submit">Sign in</button>
            </div>
        </form>
    </section>

    <template v-else>
        <aside class="sidebar">
            <div><div class="brand-mark small">O</div><strong>Odoo MCP</strong></div>
            <nav>
                <a href="#instances">Instances <span>{{ config.instances.length }}</span></a>
                <a href="#tools">Tools <span>{{ tools.length }}</span></a>
                <a href="#folders">Folders <span>{{ (config.folders || []).length }}</span></a>
                <a href="#prompts">Prompts <span>{{ config.prompts.length }}</span></a>
                <a href="#approvals">Approvals <span>{{ approvals.length }}</span></a>
            </nav>
            <div class="sidebar-footer">
                <span class="version-label">Version {{ serverVersion }}</span>
                <button @click="logout" class="button ghost w-full">Sign out</button>
            </div>
        </aside>

        <main class="content">
            <header class="page-header">
                <div><p class="eyebrow">Configuration</p><h1>Odoo workspace</h1><p class="muted">Manage connections, permissions, and reusable AI prompts.</p></div>
                <button @click="toggleDarkMode" class="icon-button" :aria-label="isDark ? 'Use light theme' : 'Use dark theme'">{{ isDark ? '☀' : '☾' }}</button>
            </header>

            <section class="stats-grid">
                <article class="panel stat"><span>Instances</span><strong>{{ config.instances.length }}</strong></article>
                <article class="panel stat"><span>Active</span><strong>{{ activeCount }}</strong></article>
                <article class="panel stat"><span>Default access</span><strong class="capitalize">{{ displayMode(config.global_settings?.default_mode) }}</strong></article>
            </section>

            <section id="instances" class="section-block">
                <div class="section-heading">
                    <div><h2>Odoo instances</h2><p class="muted text-sm">Choose which environments the MCP server can access.</p></div>
                    <button @click="openInstanceModal()" class="button primary">+ Add instance</button>
                </div>
                <div class="toolbar panel">
                    <input v-model="instanceSearch" class="search" type="search" aria-label="Search Odoo instances" placeholder="Search instances by name, URL, database, or username…">
                    <select v-model="folderFilter" aria-label="Filter by folder"><option value="">All folders</option><option value="__none__">Ungrouped</option><option v-for="folder in config.folders || []" :key="folder.id" :value="folder.id">{{ folder.name }} ({{ folderCount(folder.id) }})</option></select>
                    <select @change="updateGlobalMode($event.target.value)" :value="config.global_settings?.default_mode || 'crud'">
                        <option value="crud">Default: Full access</option><option value="read_only">Default: Read only</option>
                    </select>
                </div>
                <div v-if="instancePaged.total" class="instance-list">
                    <article v-for="inst in instancePaged.items" :key="inst.id" class="panel instance-row">
                        <div class="instance-main"><span :class="['status-dot', { active: inst.active }]"></span><div><h3>{{ inst.name }}</h3><p class="muted truncate">{{ inst.url }} · {{ inst.db }}</p><p class="muted text-sm tool-summary">{{ toolStatsFor(inst).active }} active / {{ toolStatsFor(inst).disabled }} disabled / {{ toolStatsFor(inst).total }} tools</p></div></div>
                        <div class="instance-meta"><span class="badge">{{ getFolderName(inst) }}</span><span :class="['badge', getInstanceMode(inst)]">{{ displayMode(getInstanceMode(inst)) }}</span><span class="muted text-sm">{{ inst.username }}</span></div>
                        <div class="actions"><button @click="toggleActive(inst.id)" class="button ghost">{{ inst.active ? 'Active' : 'Enable' }}</button><button @click="openInstanceModal(inst)" class="button ghost">Edit</button><button @click="deleteInstance(inst.id)" class="button danger">Delete</button></div>
                    </article>
                </div>
                <div v-else class="empty panel"><h3>{{ instanceSearch ? 'No matching instances' : 'No instances yet' }}</h3><p class="muted">{{ instanceSearch ? 'Try another search term.' : 'Add your first Odoo connection to get started.' }}</p></div>
                <div class="pager" v-if="instancePaged.total"><span class="muted text-sm">Showing {{ instancePaged.start }}-{{ instancePaged.end }} of {{ instancePaged.total }}</span><div class="pager-controls"><select :value="pageSize" @change="setPageSize($event.target.value)" aria-label="Rows per page"><option :value="20">20 rows</option><option :value="50">50 rows</option><option :value="100">100 rows</option><option :value="1000">Max (1000)</option></select><button class="button ghost" :disabled="instancePaged.page <= 1" @click="setPage('instance', instancePaged.page - 1)">Previous</button><span class="muted text-sm">Page {{ instancePaged.page }} / {{ instancePaged.pageCount }}</span><button class="button ghost" :disabled="instancePaged.page >= instancePaged.pageCount" @click="setPage('instance', instancePaged.page + 1)">Next</button></div></div>
            </section>

            <section id="folders" class="section-block">
                <div class="section-heading"><div><p class="eyebrow">Workspace</p><h2>Folders</h2><p class="muted text-sm">Group Odoo instances by project or environment. {{ ungroupedCount }} ungrouped.</p></div><button @click="openFolderModal()" class="button primary">+ Add folder</button></div>
                <div class="prompt-grid"><article v-for="folder in config.folders || []" :key="folder.id" class="panel prompt-card"><div><h3>{{ folder.name }}</h3><p class="muted prompt-preview">{{ folder.description || 'No description' }}</p></div><div class="actions"><span class="badge">{{ folderCount(folder.id) }} instances</span><button @click="openFolderModal(folder)" class="button ghost">Edit</button><button @click="deleteFolder(folder.id)" class="button danger">Delete</button></div></article></div>
                <div v-if="!(config.folders || []).length" class="empty panel"><h3>No folders yet</h3><p class="muted">Create a folder to organize production, staging, and project instances.</p></div>
            </section>

            <section id="tools" class="section-block">
                <div class="section-heading"><div><p class="eyebrow">Tool surface</p><h2>MCP tools</h2><p class="muted text-sm">Enable or disable tools globally. Instances can add further restrictions.</p></div></div>
                <div class="tool-stats">
                    <article class="panel stat"><span>All tools</span><strong>{{ toolsTotal }}</strong></article>
                    <article class="panel stat"><span>Enabled</span><strong>{{ toolsEnabled }}</strong></article>
                    <article class="panel stat"><span>Disabled</span><strong>{{ toolsDisabled }}</strong></article>
                </div>
                <div class="toolbar panel">
                    <input v-model="toolSearch" class="search" type="search" aria-label="Search tools" placeholder="Search tools by name, capability, or description…">
                    <select v-model="toolCapability"><option value="all">All capabilities</option><option v-for="capability in toolCapabilities" :key="capability" :value="capability">{{ capability }}</option></select>
                </div>
                <div class="tool-list">
                    <article v-for="tool in toolPaged.items" :key="tool.name" class="panel tool-row">
                        <div class="tool-main"><h3>{{ tool.name }}</h3><p class="muted text-sm">{{ tool.description }}</p></div>
                        <span class="badge">{{ tool.capability }}</span>
                        <label class="toggle-switch" :class="{ on: tool.enabled }" :aria-label="tool.enabled ? 'Disable ' + tool.name : 'Enable ' + tool.name"><input type="checkbox" :checked="tool.enabled" @change="setToolEnabled(tool.name, $event.target.checked)"><span class="toggle-track"><span class="toggle-thumb"></span></span><span class="toggle-text">{{ tool.enabled ? 'Enabled' : 'Disabled' }}</span></label>
                    </article>
                </div>
                <div v-if="!toolPaged.total" class="empty panel"><h3>No matching tools</h3><p class="muted">Try another search term or capability.</p></div>
                <div class="pager" v-if="toolPaged.total"><span class="muted text-sm">Showing {{ toolPaged.start }}-{{ toolPaged.end }} of {{ toolPaged.total }}</span><div class="pager-controls"><select :value="pageSize" @change="setPageSize($event.target.value)" aria-label="Rows per page"><option :value="20">20 rows</option><option :value="50">50 rows</option><option :value="100">100 rows</option><option :value="1000">Max (1000)</option></select><button class="button ghost" :disabled="toolPaged.page <= 1" @click="setPage('tool', toolPaged.page - 1)">Previous</button><span class="muted text-sm">Page {{ toolPaged.page }} / {{ toolPaged.pageCount }}</span><button class="button ghost" :disabled="toolPaged.page >= toolPaged.pageCount" @click="setPage('tool', toolPaged.page + 1)">Next</button></div></div>
            </section>

            <section id="prompts" class="section-block">
                <div class="section-heading"><div><h2>AI prompts</h2><p class="muted text-sm">Reusable instructions exposed through MCP.</p></div><button @click="openPromptModal()" class="button primary">+ Add prompt</button></div>
                <div class="prompt-grid"><article v-for="p in promptPaged.items" :key="p.id" class="panel prompt-card"><div><h3>{{ p.name }}</h3><p class="muted prompt-preview">{{ p.content }}</p></div><div class="actions"><button @click="openPromptModal(p)" class="button ghost">Edit</button><button @click="deletePrompt(p.id)" class="button danger">Delete</button></div></article></div>
                <div v-if="!promptPaged.total" class="empty panel"><h3>No prompts yet</h3><p class="muted">Create a reusable prompt for your MCP clients.</p></div>
                <div class="pager" v-if="promptPaged.total"><span class="muted text-sm">Showing {{ promptPaged.start }}-{{ promptPaged.end }} of {{ promptPaged.total }}</span><div class="pager-controls"><select :value="pageSize" @change="setPageSize($event.target.value)" aria-label="Rows per page"><option :value="20">20 rows</option><option :value="50">50 rows</option><option :value="100">100 rows</option><option :value="1000">Max (1000)</option></select><button class="button ghost" :disabled="promptPaged.page <= 1" @click="setPage('prompt', promptPaged.page - 1)">Previous</button><span class="muted text-sm">Page {{ promptPaged.page }} / {{ promptPaged.pageCount }}</span><button class="button ghost" :disabled="promptPaged.page >= promptPaged.pageCount" @click="setPage('prompt', promptPaged.page + 1)">Next</button></div></div>
            </section>
            <section id="approvals" class="section-block">
                <div class="section-heading"><div><p class="eyebrow">Safety</p><h2>Approval inbox</h2></div></div>
                <div v-if="!approvalPaged.total" class="empty panel"><h3>No approval requests</h3><p class="muted">High-risk mutation requests will appear here for review.</p></div>
                <div v-else class="prompt-grid"><article v-for="approval in approvalPaged.items" :key="approval.id" class="panel prompt-card"><div><h3>{{ approval.operation_kind }} - {{ approval.model }}</h3><p class="muted text-sm">Instance: {{ approval.instance }} - State: {{ approval.state }}</p><p class="muted text-sm">Expires: {{ approval.expires_at }}</p></div><div v-if="approval.state === 'pending'" class="actions"><button @click="approveApproval(approval.id)" class="button primary">Approve</button><button @click="rejectApproval(approval.id)" class="button danger">Reject</button></div></article></div>
                <div class="pager" v-if="approvalPaged.total"><span class="muted text-sm">Showing {{ approvalPaged.start }}-{{ approvalPaged.end }} of {{ approvalPaged.total }}</span><div class="pager-controls"><select :value="pageSize" @change="setPageSize($event.target.value)" aria-label="Rows per page"><option :value="20">20 rows</option><option :value="50">50 rows</option><option :value="100">100 rows</option><option :value="1000">Max (1000)</option></select><button class="button ghost" :disabled="approvalPaged.page <= 1" @click="setPage('approval', approvalPaged.page - 1)">Previous</button><span class="muted text-sm">Page {{ approvalPaged.page }} / {{ approvalPaged.pageCount }}</span><button class="button ghost" :disabled="approvalPaged.page >= approvalPaged.pageCount" @click="setPage('approval', approvalPaged.page + 1)">Next</button></div></div>
            </section>
        </main>

        <div v-if="showInstanceModal" class="modal-backdrop" @click.self="showInstanceModal = false">
            <form @submit.prevent="saveInstance" class="panel modal-card">
                <div class="modal-heading"><div><p class="eyebrow">Connection</p><h2>{{ newInstance.id ? 'Edit instance' : 'Add instance' }}</h2></div><button type="button" @click="showInstanceModal = false" class="icon-button">×</button></div>
                <div class="form-grid">
                    <label class="field full"><span>Instance name</span><input v-model.trim="newInstance.name" placeholder="Production Odoo" required></label>
                    <label class="field full"><span>Folder</span><select v-model="newInstance.folder_id"><option value="">Ungrouped</option><option v-for="folder in config.folders || []" :key="folder.id" :value="folder.id">{{ folder.name }} ({{ folderCount(folder.id) }})</option></select></label>
                    <label class="field full"><span>Odoo URL</span><input v-model.trim="newInstance.url" type="url" placeholder="https://example.odoo.com" required></label>
                    <label class="field"><span>Database</span><input v-model.trim="newInstance.db" required></label>
                    <label class="field"><span>Username</span><input v-model.trim="newInstance.username" autocomplete="username" required></label>
                    <label class="field full"><span>Credential source</span><select v-model="newInstance.credential_source"><option value="environment">Environment variable (recommended)</option><option value="inline">Inline secret (legacy)</option></select></label>
                    <label class="field full"><span>RPC transport</span><select v-model="newInstance.rpc_transport"><option value="auto">Auto (JSON-2 for Odoo 19+)</option><option value="jsonrpc">JSON-RPC (legacy compatibility)</option><option value="json2">JSON-2 (API key)</option></select><small>JSON-2 requires an API key with the rpc scope.</small></label>
                    <label v-if="newInstance.credential_source === 'environment'" class="field full"><span>Environment variable</span><input v-model.trim="newInstance.password_env" placeholder="ODOO_PASSWORD" required><small>Only the variable name is stored. Restart the server after changing it.</small></label>
                    <label v-else class="field full"><span>Password / API key</span><input v-model="newInstance.password" type="password" autocomplete="new-password" :placeholder="newInstance.id && !newInstance.password_env ? 'Leave blank to keep current secret' : 'Required'" :required="!newInstance.id || !!newInstance.password_env"><small v-if="newInstance.id && newInstance.has_password">A secret is already configured.</small><small class="warning-text">Inline credentials are retained only for migration compatibility.</small></label>
                    <div class="field full"><span>Instance tool overrides</span><small>{{ toolStatsFor(newInstance).active }} active / {{ toolStatsFor(newInstance).disabled }} disabled / {{ toolStatsFor(newInstance).total }} total tools</small><div class="tool-override-list"><label v-for="tool in tools" :key="'instance-tool-' + tool.name" class="check-row"><input type="checkbox" :checked="newInstance.disabled_tools.includes(tool.name)" @change="toggleInstanceTool(tool.name)"><span>{{ tool.name }}</span></label></div><small>Checked tools are disabled for this instance, even when enabled globally.</small></div>
                    <label class="field full"><span>Authorization system</span><select v-model="newInstance.policy_enabled"><option :value="false">Legacy mode (compatible)</option><option :value="true">Capability policy (default deny)</option></select></label>
                    <label v-if="!newInstance.policy_enabled" class="field full"><span>Tool access</span><select v-model="newInstance.mode"><option value="inherit">Inherit global default</option><option value="crud">Full CRUD access</option><option value="read_only">Read only</option></select></label>
                    <div v-else class="field full"><span>Instance capabilities</span><div class="capability-columns"><fieldset><legend>Allow</legend><label v-for="capability in capabilities" :key="'allow-' + capability" class="check-row"><input type="checkbox" :checked="newInstance.capability_allow.includes(capability)" @change="toggleCapability('capability_allow', capability)"><span>{{ capability }}</span></label></fieldset><fieldset><legend>Deny</legend><label v-for="capability in capabilities" :key="'deny-' + capability" class="check-row"><input type="checkbox" :checked="newInstance.capability_deny.includes(capability)" @change="toggleCapability('capability_deny', capability)"><span>{{ capability }}</span></label></fieldset></div><small>Unmatched capabilities are denied when capability policy is enabled.</small></div>
                    <label v-if="newInstance.policy_enabled" class="field full"><span>Scoped policy (advanced JSON)</span><textarea v-model="newInstance.scoped_policy_json" class="policy-editor" rows="12" spellcheck="false"></textarea><small>Configure <code>models</code> and <code>operations</code>. Model rules may contain capability <code>allow</code>/<code>deny</code>, field rules, and method decisions.</small></label>
                    <div v-if="newInstance.policy_enabled" class="policy-warning full"><strong>Default deny is active</strong><p>Any request without a matching allow rule will be rejected. More-specific field, method, operation, and model rules take precedence.</p><label v-if="!newInstance.capability_allow.length && !newInstance.capability_deny.length" class="check-row"><input v-model="newInstance.confirm_empty_policy" type="checkbox"><span>I understand an empty policy can deny all operations.</span></label></div>
                </div>
                <p v-if="formError" class="text-red-400 text-sm mt-4">{{ formError }}</p>
                <div class="modal-actions"><button type="button" @click="showInstanceModal = false" class="button ghost">Cancel</button><button class="button primary">Save instance</button></div>
            </form>
        </div>

        <div v-if="showFolderModal" class="modal-backdrop" @click.self="showFolderModal = false">
            <form @submit.prevent="saveFolder" class="panel modal-card">
                <div class="modal-heading"><div><p class="eyebrow">Workspace</p><h2>{{ newFolder.id ? 'Edit folder' : 'Add folder' }}</h2></div><button type="button" @click="showFolderModal = false" class="icon-button">×</button></div>
                <label class="field mt-4"><span>Folder name</span><input v-model.trim="newFolder.name" placeholder="Production" required></label>
                <label class="field mt-4"><span>Description</span><textarea v-model.trim="newFolder.description" rows="3" placeholder="Optional notes"></textarea></label>
                <p v-if="formError" class="text-red-400 text-sm mt-4">{{ formError }}</p>
                <div class="modal-actions"><button type="button" @click="showFolderModal = false" class="button ghost">Cancel</button><button class="button primary">Save folder</button></div>
            </form>
        </div>

        <div v-if="showPromptModal" class="modal-backdrop" @click.self="showPromptModal = false">
            <form @submit.prevent="savePrompt" class="panel modal-card">
                <div class="modal-heading"><div><p class="eyebrow">Reusable instruction</p><h2>{{ newPrompt.id ? 'Edit prompt' : 'Add prompt' }}</h2></div><button type="button" @click="showPromptModal = false" class="icon-button">×</button></div>
                <label class="field"><span>Prompt name</span><input v-model.trim="newPrompt.name" required></label>
                <label class="field mt-4"><span>Prompt content</span><textarea v-model.trim="newPrompt.content" rows="8" required></textarea></label>
                <p v-if="formError" class="text-red-400 text-sm mt-4">{{ formError }}</p>
                <div class="modal-actions"><button type="button" @click="showPromptModal = false" class="button ghost">Cancel</button><button class="button primary">Save prompt</button></div>
            </form>
        </div>
    </template>
</div>
</body>
</html>
